<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Raymer | Catálogo de productos</title>
    <meta name="description" content="Explora el catálogo de productos Raymer, consulta existencias y comunícate con nuestro equipo.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f6b3a">
    <link rel="icon" type="image/png" href="favicon.png">
    <script>
      try {
        var saved = localStorage.getItem('raymer-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
